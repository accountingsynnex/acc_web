<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FS Close Workspace — ตรวจและส่งออก (Review)</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="review">
<div class="bg"><i></i></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb">Output · <b>Review</b></div>
      <div class="spacer"></div>
      <span class="selectish"><small>งวด</small><select id="viewPeriod" title="เลือกงวดที่จะดูหน้านี้"></select></span>
      <button class="iconbtn" id="themeBtn" title="สลับโหมดสว่าง/มืด" aria-label="Toggle theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <button class="btn" id="csvBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>ส่งออก CSV</button>
    </div>
    <div class="content">
      <div class="page-head"><h1>ตรวจก่อนปิดงบ และส่งออก</h1><p>ด่านตรวจสอบก่อนสรุปงบการเงินรวม — ทุกด่านต้องผ่านก่อนส่งออกแพ็กเกจปิดงบ</p></div>
      <div class="tiles" id="tiles" style="margin-bottom:20px"></div>
      <h2 class="sec">ด่านตรวจสอบ (Closing gates)</h2>
      <div class="checklist" id="checks"></div>
      <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
        <button class="btn ghost" id="jsonBtn" style="background:var(--glass-strong);color:var(--ink);border:1px solid var(--line-strong)">ส่งออกแพ็กเกจ JSON</button>
      </div>
    </div>
  </div>
</div>
<script src="../engine/rulebook.js"></script>
<script src="../engine/group-engine.js"></script>
<script src="store.js"></script>
<script src="period-picker.js"></script>
<script src="fs.js"></script>
<script src="shell.js"></script>
<script src="review.js"></script>
</body>
</html>
